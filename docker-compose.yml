services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-prediction-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlruns
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - model_cache:/app/models/cache
      - logs:/app/logs
      - mlruns:/app/mlruns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  db:
    image: postgres:16-alpine
    container_name: olist-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
  logs:
    driver: local
  mlruns:
    driver: local
  postgres_data:
    driver: local
